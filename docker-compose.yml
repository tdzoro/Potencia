# POTENCIA — local development stack.
#
#   docker compose up --build      api on :8000, web on :8080
#   docker compose up -d db        database only (for running the API on the host)
#
# The database credentials below are local development defaults for a container
# bound to localhost. Production configuration lives in the deployment guide and
# never stores secrets in this file.

name: potencia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: potencia
      POSTGRES_PASSWORD: potencia
      POSTGRES_DB: potencia
    ports:
      - "5432:5432"
    volumes:
      - potencia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potencia -d potencia"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Rate-limit counters. Present because the API runs more than one worker in
  # this stack: per-process counters would let each worker hand out a full budget,
  # so the published limit would be true only for a single process.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Counters only — persisting them would outlive the windows they measure.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ClamAV daemon for scanning uploaded documents (PDF, DOCX) before storage and extraction.
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 5 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      POTENCIA_ENVIRONMENT: development
      POTENCIA_APP_VERSION: 0.1.0
      POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@db:5432/potencia
      POTENCIA_SECRET_KEY: ${POTENCIA_SECRET_KEY:-dev-insecure-change-me}
      POTENCIA_CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      POTENCIA_LOG_LEVEL: ${POTENCIA_LOG_LEVEL:-INFO}
      POTENCIA_REDIS_URL: redis://redis:6379/0
      POTENCIA_CLAMAV_ENABLED: ${POTENCIA_CLAMAV_ENABLED:-true}
      POTENCIA_CLAMAV_HOST: clamav
      POTENCIA_CLAMAV_PORT: 3310
      POTENCIA_CLAMAV_TIMEOUT_SECONDS: 10
      POTENCIA_CLAMAV_REQUIRED: ${POTENCIA_CLAMAV_REQUIRED:-false}
      POTENCIA_OCR_ENABLED: ${POTENCIA_OCR_ENABLED:-true}
      POTENCIA_OCR_LANGUAGE: ${POTENCIA_OCR_LANGUAGE:-eng}
      POTENCIA_OCR_TIMEOUT_SECONDS: ${POTENCIA_OCR_TIMEOUT_SECONDS:-30}
      POTENCIA_OCR_DPI: ${POTENCIA_OCR_DPI:-200}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Deletes generated export files once their 24-hour retention window ends.
  # Without this the product would keep promising a deletion it never performed.
  retention:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.tasks.retention", "--interval", "3600"]
    environment:
      POTENCIA_ENVIRONMENT: development
      POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@db:5432/potencia
      POTENCIA_SECRET_KEY: ${POTENCIA_SECRET_KEY:-dev-insecure-change-me}
      POTENCIA_LOG_LEVEL: ${POTENCIA_LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        # Baked in at build time. The browser resolves this against the host,
        # so it stays a localhost address for the whole development stack.
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  potencia-db:
