name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The suite is hermetic: no PostgreSQL and no network. A committed
        # migration that cannot be applied is caught by the next step instead.
        run: python -m pytest tests -q

      - name: Apply migrations against a real PostgreSQL
        env:
          POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@localhost:5432/potencia
          POTENCIA_SECRET_KEY: ci-secret-key-0123456789abcdefgh
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: potencia
          POSTGRES_PASSWORD: potencia
          POSTGRES_DB: potencia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U potencia -d potencia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

  scanning:
    name: Malware scanning against a real clamd
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Exercise the scanner protocol and the upload path
        env:
          POTENCIA_TEST_CLAMAV: "1"
          POTENCIA_CLAMAV_ENABLED: "true"
          POTENCIA_CLAMAV_HOST: 127.0.0.1
          POTENCIA_CLAMAV_PORT: "3310"
          POTENCIA_SECRET_KEY: ci-secret-key-0123456789abcdefgh
        # Skipped everywhere else: the rest of the suite must stay hermetic.
        run: python -m pytest tests/test_clamav_integration.py -q
    services:
      clamav:
        image: clamav/clamav:latest
        ports: ["3310:3310"]
        # The daemon downloads its signature database on first start. Without a
        # generous start period, CI polls a cold clamd and calls it broken.
        options: >-
          --health-cmd "clamdscan --ping 5"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 90s

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: potencia
          POSTGRES_PASSWORD: potencia
          POSTGRES_DB: potencia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U potencia -d potencia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install API dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the browser Playwright drives
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Migrate
        working-directory: backend
        env:
          POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@localhost:5432/potencia
          POTENCIA_SECRET_KEY: ci-secret-key-0123456789abcdefgh
        run: alembic upgrade head

      - name: Start the API
        working-directory: backend
        env:
          POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@localhost:5432/potencia
          POTENCIA_SECRET_KEY: ci-secret-key-0123456789abcdefgh
          POTENCIA_STORAGE_ROOT: /tmp/potencia-ci
          # Both spellings: the browser loads the app from 127.0.0.1 in CI, and a
          # CORS mismatch looks exactly like a broken app from inside a test.
          POTENCIA_CORS_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/health > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Build the web app against the API
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8010
        run: npm run build

      - name: Serve the build and run the journey
        working-directory: frontend
        env:
          API_BASE_URL: http://127.0.0.1:8010
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          # --host binds IPv4 explicitly. Without it vite serves `localhost`,
          # which on the runner resolves to ::1 and refuses 127.0.0.1 — the
          # difference between a suite that runs and one that fails on the
          # wrong error.
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/web.log 2>&1 &
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/login > /dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "the web build never became reachable"
            cat /tmp/web.log
            exit 1
          fi
          npx playwright test
