name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # The suite is hermetic: no PostgreSQL and no network. A committed
        # migration that cannot be applied is caught by the next step instead.
        run: python -m pytest tests -q

      - name: Apply migrations against a real PostgreSQL
        env:
          POTENCIA_DATABASE_URL: postgresql+psycopg://potencia:potencia@localhost:5432/potencia
          POTENCIA_SECRET_KEY: ci-secret-key-0123456789abcdefgh
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: potencia
          POSTGRES_PASSWORD: potencia
          POSTGRES_DB: potencia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U potencia -d potencia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
